version: '3'

includes:
  common: ../Taskfile.yml

vars:
  ARCH: '{{.ARCH | default "amd64"}}'

tasks:
  build:
    summary: Builds the Windows executable with native Go cross-compilation (no CGO)
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'

  # Console subsystem build for diagnosis: it keeps stderr/stdout, so startup
  # problems are visible in a terminal (release builds are -H windowsgui).
  build:console:
    summary: Builds bin/LifeOS-debug.exe with a console window for troubleshooting
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          CONSOLE: 'true'

  build:native:
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - 'go build -tags production -trimpath -buildvcs=false -ldflags="-w -s{{if ne .CONSOLE "true"}} -H windowsgui{{end}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}{{if eq .CONSOLE "true"}}-debug{{end}}.exe"'
      - cmd: rm -f wails_windows_{{.ARCH}}.syso
        platforms: [linux, darwin]
      - cmd: powershell Remove-Item wails_windows_{{.ARCH}}.syso -ErrorAction SilentlyContinue
        platforms: [windows]
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: '0'

  generate:syso:
    internal: true
    summary: Generates the Windows resources (icon, manifest, version info)
    dir: .
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_{{.ARCH}}.syso
