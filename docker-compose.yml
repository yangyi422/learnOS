services:
  app:
    build:
      context: .
    image: learnos:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      AI_CHALLENGE_GENERATION_TIMEOUT_SECONDS: ${AI_CHALLENGE_GENERATION_TIMEOUT_SECONDS:-60}
      AI_CURRICULUM_DRAFT_TIMEOUT_SECONDS: ${AI_CURRICULUM_DRAFT_TIMEOUT_SECONDS:-60}
      AI_SOURCE_CREDIBILITY_TIMEOUT_SECONDS: ${AI_SOURCE_CREDIBILITY_TIMEOUT_SECONDS:-45}
      AI_DOMAIN_SKELETON_TIMEOUT_SECONDS: ${AI_DOMAIN_SKELETON_TIMEOUT_SECONDS:-120}
      AI_DOMAIN_STARTER_BLUEPRINT_TIMEOUT_SECONDS: ${AI_DOMAIN_STARTER_BLUEPRINT_TIMEOUT_SECONDS:-60}
      AI_DOMAIN_INITIAL_WORLD_TIMEOUT_SECONDS: ${AI_DOMAIN_INITIAL_WORLD_TIMEOUT_SECONDS:-180}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-20}
    ports:
      - "127.0.0.1:${APP_PORT:-8888}:8080"
    volumes:
      - ${DATA_HOST_DIR:-./data}:/app/data
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups

  caddy:
    image: caddy:2.10
    profiles: ["production"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
