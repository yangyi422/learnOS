<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0118" />
    <title>LearnOS</title>
    <script>
      try {
        const saved = localStorage.getItem('learnos-theme')
        const theme = saved === 'light' || (saved === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch { document.documentElement.dataset.theme = 'dark'; document.documentElement.style.colorScheme = 'dark' }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
