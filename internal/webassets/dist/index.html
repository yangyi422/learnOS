<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>LearnOS</title>
    <script>
      try {
        const saved = localStorage.getItem('learnos-theme')
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch { /* the application initializes the theme when storage is unavailable */ }
    </script>
    <script type="module" crossorigin src="/assets/index-BVxJKhD-.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BIhWOssQ.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
