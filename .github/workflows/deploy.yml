name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Frontend typecheck
        working-directory: web
        run: npm run typecheck

      - name: Frontend tests
        working-directory: web
        run: npm run test

      - name: Frontend production build
        working-directory: web
        run: npm run build

  deploy:
    name: Deploy to production server
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          mkdir -p "$HOME/.ssh"
          key_file="$RUNNER_TEMP/learnos-deploy-key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "deploy_port=$DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Update and restart LearnOS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          ssh -i "$key_file" \
            -p "$deploy_port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          test "$(git symbolic-ref --short HEAD)" = "main"
          git fetch origin main
          target_commit="$(git rev-parse origin/main)"
          git merge --ff-only origin/main
          deployed_commit="$(git rev-parse HEAD)"
          test "$deployed_commit" = "$target_commit"
          echo "deploy_path=$deploy_path"
          echo "deployed_commit=$deployed_commit"
          docker compose --profile production up -d --build --force-recreate
          docker compose --profile production ps
          REMOTE
